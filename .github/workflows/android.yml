# Builds the Android debug APK (Capacitor wrapper of the client) and attaches it
# to the run: open the run in the Actions tab and download "super-maze-debug-apk".
# Debug builds show Google's test ads and keep online play; see docs/android-apk-handoff.md.
# GitHub's ubuntu runner already has the Android SDK (ANDROID_HOME).
name: android
on:
  push:
    paths:
      - apps/client/**
      - packages/**
      - content/maps/**
      - package-lock.json
      - .github/workflows/android.yml
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle
      - run: npm ci
      - run: npm run android:apk
      - uses: actions/upload-artifact@v4
        with:
          name: super-maze-debug-apk
          path: apps/client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
